[package]
name = "mini-go"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust runtime for the Mini-Go language"
readme = "README.md"
publish = ["crates-io"]
include = [
    "/src/**",
    "/examples/**/*.rs",
    "/examples/blocks/*.json",
    "/README.md",
    "/USAGE.md",
    "/LICENSE",
    "/LICENSE-Go",
]

[lib]
name = "mini_go"
path = "src/lib.rs"

[features]
host-conformance = []
rpc = ["dep:tokio"]
stdlib-host = ["rpc"]
rpc-gateway = ["rpc", "dep:tokio-tungstenite", "dep:futures-util", "dep:tokio-rustls", "dep:url", "dep:percent-encoding"]

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value", "arbitrary_precision"] }
serde_bytes = "0.11"
sha2 = { version = "0.10", features = ["compress"] }
flate2 = "1.1"
getrandom = "0.3"
web-time = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "macros", "rt"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util"], optional = true }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
url = { version = "2", optional = true }
percent-encoding = { version = "2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"


[workspace]
members = [
    "runtime-wasm",
    "tooling",
    "../../cmd/mini-go-rpc-peer-rust",
    "../../cmd/mini-go-tools",
]
default-members = ["."]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/d7z-team/go-mini"

[workspace.dependencies]
mini-go = { path = ".", version = "=0.0.0-dev" }
mini-go-tooling = { path = "tooling", version = "=0.0.0-dev" }

[[bench]]
name = "runtime"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
