[package]
name = "mini-go-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
repository = "https://github.com/d7z-team/go-mini"
description = "WebAssembly bindings for the Mini-Go runtime"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["rpc"]
rpc = ["mini-go/rpc", "dep:tokio"]

[dependencies]
mini-go = { path = ".." }
mini-go-tooling = { path = "../tooling" }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde-wasm-bindgen = "0.6"
serde_json = "1"
tokio = { version = "1", features = ["sync"], optional = true }
web-time = "1"
