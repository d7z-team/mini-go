name: Syntax fuzz

on:
  schedule:
    - cron: '23 3 * * 1,4'
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - run: FUZZTIME=3m FUZZ_PARALLEL=1 make fuzz-syntax
