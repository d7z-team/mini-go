name: Rust runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      workflow: runtime-rust.yml
  conformance:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            playground/runtime-rust/target
          key: rust-runtime-${{ runner.os }}-1.98.1-${{ hashFiles('playground/runtime-rust/Cargo.lock') }}
      - run: make runtime-rust-lint runtime-rust-test runtime-rust-conformance
      - run: make runtime-rust-rpc-test test-rpc-conformance
      - run: make runtime-rust-host-test runtime-rust-host-conformance
