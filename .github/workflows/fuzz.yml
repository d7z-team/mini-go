name: Go fuzz

on:
  schedule:
    - cron: '23 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      workflow: fuzz.yml
  fuzz:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: rustup default 1.98.1
      - run: make artifacts
      - run: FUZZTIME=3m FUZZ_PARALLEL=1 make fuzz
