name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - uses: actions/cache@v4
        with:
          path: /tmp/mini-go/cache
          key: mini-go-oracle-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'compiler/**/*.go', 'runtime/**/*.go', 'ffi/**/*.go', 'stdlib/**/*.go', 'stdlib/**/*.mgo', 'tooling/runtimecheck/*.go') }}
          restore-keys: mini-go-oracle-${{ runner.os }}-
      - run: make generate
      - run: git diff --exit-code
      - run: make lint
      - name: Test with coverage
        run: |
          make coverage
          {
            echo '### Go test coverage'
            echo
            echo '```text'
            go tool cover -func=coverage.txt | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.txt
            coverage.html
          if-no-files-found: error
          retention-days: 14
      - run: make build
