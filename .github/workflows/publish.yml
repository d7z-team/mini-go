name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      workflow: publish.yml

  go:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: rustup default 1.98.1
      - uses: actions/cache@v4
        with:
          path: /tmp/mini-go/cache
          key: mini-go-oracle-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'compiler/**/*.go', 'runtime/**/*.go', 'ffi/**/*.go', 'stdlib/**/*.go', 'stdlib/**/*.mgo', 'tooling/runtimecheck/*.go') }}
          restore-keys: mini-go-oracle-${{ runner.os }}-
      - run: make generate
      - run: git diff --exit-code
      - run: make lint
      - name: Test with coverage
        run: |
          make coverage
          {
            echo '### Go test coverage'
            echo
            echo '```text'
            go tool cover -func=coverage.txt | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.txt
            coverage.html
          if-no-files-found: error
          retention-days: 14
      - run: make build

  rust:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.98.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            playground/runtime-rust/target
          key: rust-runtime-${{ runner.os }}-1.98.1-${{ hashFiles('playground/runtime-rust/Cargo.lock') }}
      - run: make artifacts
      - run: make lint-rust test-rust test-interop

  plan:
    needs: [changes, go, rust]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.changed == 'false' ||
       (needs.go.result == 'success' && needs.rust.result == 'success')) &&
      github.repository == 'd7z-team/mini-go' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Decide whether to publish
        id: plan
        run: |
          git fetch --no-tags origin main
          node .github/scripts/release-plan.mjs

  publish:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    concurrency:
      group: publish-packages
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/release-target
      MINIGO_CACHE: /tmp/mini-go/cache
      RELEASE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - name: Verify release source
        run: |
          if [[ "$GITHUB_REPOSITORY" != d7z-team/mini-go ]]; then
            echo "::error::Publish requires repository d7z-team/mini-go; got $GITHUB_REPOSITORY"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::error::Checkout does not match the release plan"
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Publish requires a clean working tree"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.98.1
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: playground/runtime-rust/runtime-wasm/package-lock.json
      - name: Install publishing npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/publishing-npm" npm@12.0.2
          "$RUNNER_TEMP/publishing-npm/bin/npm" --version
          echo "$RUNNER_TEMP/publishing-npm/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/release-target
          key: publish-${{ runner.os }}-rust-1.98.1-${{ hashFiles('playground/runtime-rust/Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: /tmp/mini-go/cache
          key: mini-go-oracle-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'compiler/**/*.go', 'runtime/**/*.go', 'ffi/**/*.go', 'stdlib/**/*.go', 'stdlib/**/*.mgo', 'tooling/runtimecheck/*.go') }}
          restore-keys: mini-go-oracle-${{ runner.os }}-
      - name: Install WASM and browser tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          make deps
          npm exec --prefix playground/runtime-rust/runtime-wasm -- playwright install --with-deps chromium firefox
      - name: Verify TypeScript, WASM and compiler tooling
        run: |
          make artifacts
          make test-wasm
      - name: Build and verify release artifacts
        run: |
          export GOCACHE="$(go env GOCACHE)"
          make release-package release-verify
      - name: Check candidate before publishing
        id: candidate
        run: |
          git fetch --no-tags origin main
          if [[ "$RELEASE_SHA" == "$(git rev-parse origin/main)" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit superseded this candidate; no packages published.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Authenticate with crates.io
        if: steps.candidate.outputs.current == 'true'
        id: crates
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish packages
        if: steps.candidate.outputs.current == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN"
          version=$(node -e 'const value=require("./build/release/release.json");process.stdout.write(value.version)')
          rust=build/release/source/playground/runtime-rust
          user_agent='go-mini-publish/1.0 (https://github.com/d7z-team/mini-go)'

          crate_checksum() {
            curl -A "$user_agent" -fsSL "https://crates.io/api/v1/crates/$1" |
              node -e 'let text="";process.stdin.on("data",value=>text+=value).on("end",()=>{const [version]=process.argv.slice(1);const item=JSON.parse(text).versions.find(value=>value.num===version);if(!item)process.exit(2);process.stdout.write(item.checksum)})' "$version"
          }
          publish_crate() {
            package=$1
            local_checksum=$(sha256sum "build/release/$package-$version.crate" | cut -d ' ' -f 1)
            if remote_checksum=$(crate_checksum "$package" 2>/dev/null); then
              test "$remote_checksum" = "$local_checksum"
              echo "$package $version already published with matching checksum"
              return
            fi
            cargo publish --manifest-path "$rust/Cargo.toml" --locked -p "$package"
            for attempt in $(seq 1 30); do
              if remote_checksum=$(crate_checksum "$package" 2>/dev/null); then
                test "$remote_checksum" = "$local_checksum"
                return
              fi
              sleep 2
            done
            echo "$package $version did not appear in crates.io" >&2
            exit 1
          }

          publish_crate mini-go
          runtime_checksum=$(crate_checksum mini-go)

          npm_tarball="build/release/d7z-team-mini-go-$version.tgz"
          if npm view "@d7z-team/mini-go@$version" version --json \
            --prefer-online --fetch-retries=0 --fetch-timeout=10000 >/dev/null 2>&1; then
            echo "@d7z-team/mini-go $version already published"
          else
            npm publish "$npm_tarball" --tag git --access public --provenance
          fi

          {
            echo "### Published packages"
            echo
            echo "- [mini-go $version](https://crates.io/crates/mini-go/$version): \`$runtime_checksum\`"
            echo "- [@d7z-team/mini-go@$version](https://www.npmjs.com/package/@d7z-team/mini-go/v/$version) (git tag)"
            echo "- compiler SHA-256: $(node -e 'const value=require("./build/release/release.json");process.stdout.write(value.compilerSHA256)')"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload published artifacts
        if: steps.candidate.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: registry-packages
          path: |
            build/release/*.crate
            build/release/*.tgz
            build/release/*.json
            build/release/*.files
            build/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
