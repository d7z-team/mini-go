name: Check code changes

on:
  workflow_call:
    inputs:
      workflow:
        required: true
        type: string
    outputs:
      changed:
        value: ${{ jobs.changes.outputs.changed }}

permissions:
  contents: read
  actions: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Compare code changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ${{ inputs.workflow }}
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node .github/scripts/changes.mjs
      - name: Verify CI scripts
        if: steps.changes.outputs.changed == 'true'
        run: make test-scripts
